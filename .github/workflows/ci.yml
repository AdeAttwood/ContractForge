name: CI

on:
  push: { branches: ["0.x"] }
  pull_request: { branches: ["0.x"] }

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Task
        uses: go-task/setup-task@v1

      - name: Lint
        run: task actions:lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Dotnet
        uses: actions/setup-dotnet@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Setup Task
        uses: go-task/setup-task@v1

      - run: dotnet build /warnaserror

      - run: dotnet test /warnaserror

      - name: Lint
        run: task test-all

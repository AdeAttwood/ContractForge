version: "3"

vars:
  PROJECT_NAME: DenoTypescriptClient
  DOTNET_TARGET: '{{default "net10.0" .DOTNET_TARGET}}'
  THRIFT_FILE: ../DotnetJsonWebApi/calculator.thrift
  GENERATED_FILE: generated/calculator-service.gen.ts
  CLI_PROJECT: ../../src/ContractForge.Cli/ContractForge.Cli.csproj

tasks:
  check:
    desc: Check the typescript types
    cmd: deno check

  test:
    desc: Run integration tests against the selected .NET sample target
    cmd: deno test --allow-run --allow-net --allow-env=DOTNET_TARGET
    env:
      DOTNET_TARGET: "{{.DOTNET_TARGET}}"

  generate:
    desc: Regenerate client code from Thrift
    cmds:
      - echo "Generating client code from {{.THRIFT_FILE}}..."
      - dotnet run --project {{.CLI_PROJECT}} -- -e ./{{.THRIFT_FILE}} -g typescript-client -o {{.GENERATED_FILE}}
      - echo "✓ Generated code written to {{.GENERATED_FILE}}"
    sources:
      - "{{.THRIFT_FILE}}"
    generates:
      - "{{.GENERATED_FILE}}"
